<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuvora — Personal Life OS</title>
    <meta name="description" content="Your intelligent productivity operating system — tasks, goals, habits, focus, and AI in one place." />

    <!-- Theme color — updated dynamically by ThemeContext -->
    <meta id="theme-color-meta" name="theme-color" content="#c3a1f7" />

    <!-- App icon — the violet ribbon mark -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Paddle.js — checkout overlay for Premium purchases -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

    <!-- Google Identity Services is loaded dynamically by Login.jsx instead of
         statically here, with a ?hl= param matching the app's own language —
         Google otherwise infers locale from the browser's Accept-Language
         header, which can silently disagree with what the rest of the UI
         is showing (e.g. an Arabic-preferring browser rendering the button
         in Arabic while the app itself is displaying English). -->

    <!-- Fonts — display + body + mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Anti-flash script — runs synchronously before first paint.
      Applies .dark to <html> immediately so React never renders
      in the wrong theme. Must stay inline, must stay in <head>.
    -->
    <script>
      (function () {
        try {
          var KEY      = 'nuvora_theme';
          var OLD_KEY  = 'aurora_theme';
          var stored   = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY) || 'system';
          var sysDark  = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark   = stored === 'dark' || (stored === 'system' && sysDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0c0a1a');
          }
        } catch (e) {
          // localStorage blocked (private mode) — silently fall back to light
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
