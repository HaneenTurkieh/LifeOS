<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuvora — Personal Life OS</title>
    <meta name="description" content="Your intelligent productivity operating system — tasks, goals, habits, focus, and AI in one place." />

    <!-- Theme color — updated dynamically by ThemeContext -->
    <meta id="theme-color-meta" name="theme-color" content="#c3a1f7" />

    <!-- App icon — the violet ribbon mark -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Paddle.js — checkout overlay for Premium purchases -->
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

    <!-- Google Identity Services is loaded dynamically by Login.jsx instead of
         statically here, with a ?hl= param matching the app's own language —
         Google otherwise infers locale from the browser's Accept-Language
         header, which can silently disagree with what the rest of the UI
         is showing (e.g. an Arabic-preferring browser rendering the button
         in Arabic while the app itself is displaying English). -->

    <!-- Fonts — display + body + mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Anti-flash script — runs synchronously before first paint.
      Applies .dark to <html> immediately so React never renders
      in the wrong theme. Must stay inline, must stay in <head>.
    -->
    <script>
      (function () {
        try {
          var KEY      = 'nuvora_theme';
          var OLD_KEY  = 'aurora_theme';
          var stored   = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY) || 'system';
          var sysDark  = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark   = stored === 'dark' || (stored === 'system' && sysDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#0c0a1a');
          }
        } catch (e) {
          // localStorage blocked (private mode) — silently fall back to light
        }
      })();
    </script>

    <!--
      Splash — plain CSS/HTML, no Tailwind (that's bundled into the JS
      chunk and isn't available until main.jsx has loaded/executed).
      Opening Nuvora from an iPhone Home Screen icon has no native splash
      configured (no apple-touch-startup-image), so on a cold launch —
      worse on a slow connection — the very first thing on screen used to
      be a stark blank white rectangle for however long the JS bundle
      took to download and parse. This renders as part of the raw HTML
      response itself, before any JS runs at all, so there's a branded
      screen (same mark + gradient as Login, no actual login form) up
      instantly instead of white. createRoot().render() in main.jsx wipes
      #root's children the moment React mounts, so this needs no manual
      teardown — it just gets replaced.
    -->
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 10% 0%, #EFEAFF 0%, #F4F6FB 35%, #EAF4F6 100%);
      }
      html.dark #splash {
        background: radial-gradient(circle at 10% 0%, #1b1633 0%, #0c0a1a 45%, #11182b 100%);
      }
      #splash img { width: 56px; height: 56px; filter: drop-shadow(0 8px 20px rgba(124,92,255,0.35)); }
      #splash span {
        font-family: 'Outfit', system-ui, sans-serif; font-weight: 700; font-size: 1.1rem;
        letter-spacing: 0.3em; color: #6B5BD6; text-transform: uppercase;
      }
      html.dark #splash span { color: #C3B4FF; }
      #splash .dot {
        width: 6px; height: 6px; border-radius: 999px; background: #A78BFA;
        animation: splash-pulse 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse { 0%, 100% { opacity: 0.25; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="splash">
        <img src="/icon-192.png" alt="" />
        <span>Nuvora</span>
        <div class="dot"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
